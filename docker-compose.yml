version: "3.8"

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: tickerpro
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tickerpro"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot: apply committed Prisma migrations, then exit. api/worker wait for
  # this to complete so they never start against an un-migrated schema.
  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: npx prisma migrate deploy --schema packages/database/prisma/schema.prisma
    environment:
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/tickerpro
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

  kafka:
    image: bitnami/kafka:latest
    ports:
      - "9092:9092"
    environment:
      - KAFKA_CFG_NODE_ID=1
      - KAFKA_CFG_PROCESS_ROLES=broker,controller
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=1@kafka:9093
      - ALLOW_PLAINTEXT_LISTENER=yes
    volumes:
      - kafkadata:/bitnami/kafka

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/tickerpro
      - JWT_SECRET=${JWT_SECRET:?set JWT_SECRET}
      - REDIS_URL=redis://redis:6379
      - KAFKA_BROKERS=kafka:9092
      - META_APP_SECRET=${META_APP_SECRET:-}
      - META_WEBHOOK_VERIFY_TOKEN=${META_WEBHOOK_VERIFY_TOKEN:-}
      - SHOPIFY_API_SECRET=${SHOPIFY_API_SECRET:-}
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_started
      kafka:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:4000/api/health/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    # Build output lives at apps/api/dist — use the workspace script, not a bare
    # `node dist/worker.js` (which resolves against the wrong working directory).
    command: npm run start:worker --workspace=api
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/tickerpro
      - JWT_SECRET=${JWT_SECRET:?set JWT_SECRET}
      - REDIS_URL=redis://redis:6379
      - KAFKA_BROKERS=kafka:9092
      - META_APP_SECRET=${META_APP_SECRET:-}
      - META_WEBHOOK_VERIFY_TOKEN=${META_WEBHOOK_VERIFY_TOKEN:-}
      - SHOPIFY_API_SECRET=${SHOPIFY_API_SECRET:-}
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_started
      kafka:
        condition: service_started

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # Browser-facing API URL, baked into the client bundle at build time.
        # Override for real deployments (e.g. https://api.yourdomain.com).
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
    depends_on:
      api:
        condition: service_healthy

  webhook-processor:
    build:
      context: .
      dockerfile: apps/webhook-processor/Dockerfile
    ports:
      - "4001:4001"
    environment:
      - NODE_ENV=production
      - KAFKA_BROKERS=kafka:9092
    depends_on:
      - kafka

  # Local LLM server. The API/worker talk to it directly via the Node AI gateway
  # (OPENAI_API_BASE=http://ollama:11434/v1) for copilot, sentiment, and RAG.
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollamadata:/root/.ollama

  clickhouse:
    image: clickhouse/clickhouse-server:latest
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - clickhousedata:/var/lib/clickhouse

volumes:
  pgdata:
  redisdata:
  kafkadata:
  ollamadata:
  clickhousedata:
